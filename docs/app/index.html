<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/app/favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="/app/logo192.png" />
    <link rel="manifest" href="/app/manifest.json" />
    <title>Data Illustrateur</title>
    <link href="/app/static/css/main.18157aca.chunk.css" rel="stylesheet">
    <link href="/app/guide/guide.css" rel="stylesheet">
    <script src="https://app.dataviz.jp/lib/supabase.js"></script>

    <style>
        dataviz-header {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 2147483647;
            display: block;
        }

        dataviz-tool-header {
            position: fixed !important;
            top: 48px;
            left: 0;
            width: 100%;
            z-index: 2147483646;
            display: block;
            height: 48px;
        }

        #root {
            margin-top: 108px;
            height: calc(100vh - 108px);
            overflow: hidden;
            position: relative;
        }

        /* Header specific styles to replace Bootstrap */
        header.navbar {
            position: fixed;
            top: 48px;
            left: 0;
            right: 0;
            height: 60px;
            background-color: #fff;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            padding: 0.5rem 1rem;
            z-index: 1000;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        header.navbar *,
        header.navbar *::before,
        header.navbar *::after {
            box-sizing: border-box;
        }

        header.navbar .container {
            width: 100%;
            max-width: none;
            margin: 0;
            padding-left: 16px;
            /* Align with global header logo */
            display: flex;
            align-items: center;
        }

        header.navbar .navbar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1d2d35;
            text-decoration: none;
            white-space: nowrap;
        }

        header.navbar .menu-btn,
        header.navbar .menu-icon,
        header.navbar .navbar-nav {
            display: none;
        }
    </style>
</head>

<body><noscript>You need to enable JavaScript to run this app.</noscript>
    <dataviz-tool-header></dataviz-tool-header>
    <header class="navbar fixed-top navbar-expand-md navbar-light" style="display: none;">
        <div class="container"><input class="menu-btn order-0" type="checkbox" id="menu-btn">
            <label class="menu-icon d-md-none" for="menu-btn"><span class="navicon"></span></label><a
                class="navbar-brand order-1 order-md-0 me-auto" href="https://data-illustrator.dataviz.jp/">Data
                Illustrateur</a>
            <ul class="navbar-nav social-nav order-3 order-md-5"></ul>
            <div class="collapse navbar-collapse order-4 order-md-1">

                <div class="break order-6 d-md-none"></div>
            </div>
        </div>
    </header>
    <div id="root"></div>
